name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gfortran python3 python3-matplotlib python3-numpy \
            python3-psutil python3-pytest python3-scipy
      - name: Build full analytic SO3 backends
        run: make bin/tmatrix_so3_mstm bin/tmatrix_so3_mstm_fp32
      - name: Run release host audit
        run: CXX=g++ scripts/release_audit.sh --host
